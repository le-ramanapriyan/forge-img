<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crop images — ForgeIMG</title>
    <meta name="description" content="Crop images in your browser with a free selection or a fixed ratio. Files stay on your device." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/tokens.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/site.css" />
  </head>
  <body data-tool="crop">
    <div class="site-shell">
      <header class="site-header" id="site-header"></header>
      <main class="site-main">
        <div class="tool-layout">
          <section class="tool-page-hero">
            <p class="eyebrow">Crop</p>
            <h1>Crop images</h1>
            <p>
              Drag on the preview to choose what to keep. Use a free selection,
              or lock the frame to 1:1, 4:3, or 16:9.
            </p>
            <ul class="tool-points">
              <li>Preview uses the first image</li>
              <li>The same crop is applied to the whole batch</li>
              <li>WebP and JPEG are saved at 92% quality</li>
            </ul>
          </section>
          <div id="tool-workspace"></div>
        </div>
      </main>
      <footer class="site-footer" id="site-footer"></footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="../assets/js/chrome.js"></script>
    <script src="../assets/js/core.js"></script>
    <script src="../assets/js/tool-shell.js"></script>
    <script src="tool.js"></script>
  </body>
</html>
