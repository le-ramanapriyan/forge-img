[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "png-to-webp"
version = "1.0.0"
description = "PNG → WebP converter with hard size budgets (personal tool)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "RAMANAPRIYAN M R V", email = "le-ramanapriyan@users.noreply.github.com" },
]
keywords = ["webp", "png", "image", "compression", "cli"]
dependencies = [
  "Pillow>=10.0.0",
]

[project.scripts]
png2webp = "png_to_webp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
